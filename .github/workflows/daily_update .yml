name: Daily Panchang Auto Update

on:
  schedule:
    - cron: '31 18 * * *'
  workflow_dispatch:

jobs:
  update-panchang:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Generate Today.json
        run: |
          echo '{' > today.json
          echo '  "tithi": "आज का पंचांग",' >> today.json
          echo '  "nakshatra": "शुभ नक्षत्र",' >> today.json
          echo '  "sunrise": "06:00 AM",' >> today.json
          echo '  "sunset": "06:30 PM"' >> today.json
          echo '}' >> today.json

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Panchang for today" && git push)

