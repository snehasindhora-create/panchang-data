name: Daily Panchang Auto Update

on:
  schedule:
    # रोज़ रात भारतीय समयानुसार 12:01 AM (UTC 18:31) पर चलेगा
    - cron: '31 18 * * *'
  workflow_dispatch:

jobs:
  update-panchang:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Update Script
        run: python update_panchang.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Panchang for today" && git push)

